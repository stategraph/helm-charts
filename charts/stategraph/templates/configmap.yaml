apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stategraph.fullname" . }}
  labels:
    {{- include "stategraph.labels" . | nindent 4 }}
data:
  STATEGRAPH_UI_BASE: {{ .Values.stategraph.ui.base | quote }}
  STATEGRAPH_OAUTH_REDIRECT_BASE: {{ include "stategraph.oauthRedirectBase" . | quote }}
  STATEGRAPH_PORT: {{ .Values.stategraph.port | quote }}
  STATEGRAPH_DB_STATEMENT_TIMEOUT: {{ .Values.stategraph.db.statementTimeout | quote }}
  STATEGRAPH_COST_ENABLED: {{ .Values.stategraph.cost.enabled | quote }}
  # Only "0" and "false" turn scanning off; any other value, including an
  # empty string, turns it on.
  STATEGRAPH_SECURITY: {{ ternary "1" "0" .Values.stategraph.security.enabled | quote }}
  DB_HOST: {{ include "stategraph.dbHost" . | quote }}
  DB_PORT: {{ .Values.postgresql.port | quote }}
  DB_USER: {{ .Values.postgresql.auth.username | quote }}
  DB_NAME: {{ .Values.postgresql.auth.database | quote }}
  {{- if .Values.stategraph.cost.enabled }}
  # The pricing service reads PRICING_DB_*, not DB_*. Its image defaults name
  # the Docker Compose service "db", which does not exist here.
  PRICING_DB_HOST: {{ include "stategraph.dbHost" . | quote }}
  PRICING_DB_PORT: {{ .Values.postgresql.port | quote }}
  PRICING_DB_USER: {{ .Values.postgresql.auth.username | quote }}
  PRICING_DB_NAME: {{ .Values.stategraph.cost.databaseName | quote }}
  PRICING_DB_SSLMODE: {{ .Values.stategraph.cost.sslMode | quote }}
  {{- with .Values.stategraph.cost.refreshHours }}
  PRICING_REFRESH_HOURS: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.stategraph.oauth.enabled }}
  STATEGRAPH_OAUTH_TYPE: {{ .Values.stategraph.oauth.type | quote }}
  STATEGRAPH_OAUTH_DISPLAY_NAME: {{ .Values.stategraph.oauth.displayName | quote }}
  STATEGRAPH_OAUTH_EMAIL_DOMAIN: {{ .Values.stategraph.oauth.emailDomain | quote }}
  {{- if eq .Values.stategraph.oauth.type "google" }}
  {{- if .Values.stategraph.oauth.google.group }}
  STATEGRAPH_OAUTH_GOOGLE_GROUP: {{ .Values.stategraph.oauth.google.group | quote }}
  {{- end }}
  {{- if .Values.stategraph.oauth.google.adminEmail }}
  STATEGRAPH_OAUTH_GOOGLE_ADMIN_EMAIL: {{ .Values.stategraph.oauth.google.adminEmail | quote }}
  {{- end }}
  {{- end }}
  {{- if eq .Values.stategraph.oauth.type "oidc" }}
  STATEGRAPH_OAUTH_OIDC_ISSUER_URL: {{ .Values.stategraph.oauth.oidc.issuerUrl | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.stategraph.orchestration.enabled }}
  STATEGRAPH_ORCHESTRATION_ENABLED: "true"
  TERRAT_API_BASE: {{ include "stategraph.orchestration.apiBase" . | quote }}
  TERRAT_UI_BASE: {{ include "stategraph.orchestration.uiBase" . | quote }}
  TERRAT_WEB_BASE_URL: {{ include "stategraph.orchestration.webBaseUrl" . | quote }}
  TERRAT_DB_NAME: {{ .Values.stategraph.orchestration.databaseName | quote }}
  STATEGRAPH_FDW_DBNAME: {{ .Values.stategraph.orchestration.databaseName | quote }}
  STATEGRAPH_FDW_USER: {{ .Values.stategraph.orchestration.fdw.user | quote }}
  STATEGRAPH_FDW_PROVISIONER_USER: {{ .Values.stategraph.orchestration.fdw.provisionerUser | quote }}
  {{- with .Values.stategraph.orchestration.telemetryLevel }}
  TERRAT_TELEMETRY_LEVEL: {{ . | quote }}
  {{- end }}
  {{- if include "stategraph.github.enabled" . }}
  {{- with .Values.stategraph.orchestration.github.appUrl }}
  GITHUB_APP_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.stategraph.orchestration.github.apiBaseUrl }}
  GITHUB_API_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.stategraph.orchestration.github.webBaseUrl }}
  GITHUB_WEB_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if include "stategraph.gitlab.enabled" . }}
  {{- with .Values.stategraph.orchestration.gitlab.apiBaseUrl }}
  GITLAB_API_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.stategraph.orchestration.gitlab.webBaseUrl }}
  GITLAB_WEB_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
