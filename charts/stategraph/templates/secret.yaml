{{/*
This Secret carries independent things: the generated database password, the
OAuth credentials, the license key, the two FDW role passwords, and the inline
GitHub or GitLab credentials. They are gated separately -- pointing
postgresql.auth.existingSecret at an externally managed Secret must not suppress
the OAuth keys, which deployment.yaml always reads from THIS Secret by name.
Gating the whole file on the database left those pods in
CreateContainerConfigError.

Each part can also be handed off to an externally managed Secret through its
existingSecret value, so nothing here has to be written down in a values file
that gets committed to git. When every part is external this file renders
nothing at all.
*/}}
{{- $manageDbPassword := not .Values.postgresql.auth.existingSecret }}
{{- $manageOauth := and .Values.stategraph.oauth.enabled (not .Values.stategraph.oauth.existingSecret) }}
{{- $manageLicense := and .Values.stategraph.license.key (not .Values.stategraph.license.existingSecret) }}
{{- $manageFdw := and .Values.stategraph.orchestration.enabled (not .Values.stategraph.orchestration.fdw.existingSecret) }}
{{- $manageGithub := and .Values.stategraph.orchestration.enabled .Values.stategraph.orchestration.github.appId (not .Values.stategraph.orchestration.github.existingSecret) }}
{{- $manageGitlab := and .Values.stategraph.orchestration.enabled .Values.stategraph.orchestration.gitlab.appId (not .Values.stategraph.orchestration.gitlab.existingSecret) }}
{{- if or $manageDbPassword $manageOauth $manageLicense $manageFdw $manageGithub $manageGitlab }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "stategraph.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stategraph.fullname" . }}
  labels:
    {{- include "stategraph.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $manageDbPassword }}
  {{- if .Values.postgresql.auth.password }}
  db-password: {{ .Values.postgresql.auth.password | quote }}
  {{- else }}
  # No explicit password was provided, so we generate one. On upgrades we must
  # reuse the password already stored in the existing Secret — Postgres baked the
  # original password into its data directory at first init, so regenerating it
  # here would break authentication for the already-provisioned database.
  {{- if and $existing $existing.data (index $existing.data "db-password") }}
  db-password: {{ index $existing.data "db-password" | b64dec | quote }}
  {{- else }}
  db-password: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $manageOauth }}
  oauth-client-id: {{ .Values.stategraph.oauth.clientId | quote }}
  oauth-client-secret: {{ .Values.stategraph.oauth.clientSecret | quote }}
  # oauth2-proxy cookie-signing secret. It must be identical across every
  # replica and stable across restarts — the app generates a random one per
  # process when this is unset, so with replicaCount > 1 (or after any restart)
  # a login whose callback lands on a different pod fails with
  # "invalid CSRF token". Honor an explicit value; otherwise reuse the one
  # already stored (so `helm upgrade` doesn't rotate it and log everyone out);
  # otherwise generate a stable 32-char value on first install.
  {{- if .Values.stategraph.oauth.cookieSecret }}
  oauth-cookie-secret: {{ .Values.stategraph.oauth.cookieSecret | quote }}
  {{- else if and $existing $existing.data (index $existing.data "oauth-cookie-secret") }}
  oauth-cookie-secret: {{ index $existing.data "oauth-cookie-secret" | b64dec | quote }}
  {{- else }}
  oauth-cookie-secret: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- if and (eq .Values.stategraph.oauth.type "google") .Values.stategraph.oauth.google.serviceAccountJson }}
  oauth-service-account-json: {{ .Values.stategraph.oauth.google.serviceAccountJson | quote }}
  {{- end }}
  {{- end }}
  {{- if $manageLicense }}
  license-key: {{ .Values.stategraph.license.key | quote }}
  {{- end }}
  {{- if $manageFdw }}
  # The FDW role passwords follow the cookie secret's rule: an explicit value,
  # else the stored one, else a generated one. The provisioning init container sets the
  # roles to whatever is stored here, so a rotation only needs a new value.
  {{- if .Values.stategraph.orchestration.fdw.password }}
  fdw-password: {{ .Values.stategraph.orchestration.fdw.password | quote }}
  {{- else if and $existing $existing.data (index $existing.data "fdw-password") }}
  fdw-password: {{ index $existing.data "fdw-password" | b64dec | quote }}
  {{- else }}
  fdw-password: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- if .Values.stategraph.orchestration.fdw.provisionerPassword }}
  fdw-provisioner-password: {{ .Values.stategraph.orchestration.fdw.provisionerPassword | quote }}
  {{- else if and $existing $existing.data (index $existing.data "fdw-provisioner-password") }}
  fdw-provisioner-password: {{ index $existing.data "fdw-provisioner-password" | b64dec | quote }}
  {{- else }}
  fdw-provisioner-password: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- end }}
  {{- if $manageGithub }}
  github-app-id: {{ .Values.stategraph.orchestration.github.appId | quote }}
  github-app-client-id: {{ .Values.stategraph.orchestration.github.clientId | quote }}
  github-app-client-secret: {{ .Values.stategraph.orchestration.github.clientSecret | quote }}
  github-app-pem: {{ .Values.stategraph.orchestration.github.pem | quote }}
  github-webhook-secret: {{ .Values.stategraph.orchestration.github.webhookSecret | quote }}
  {{- end }}
  {{- if $manageGitlab }}
  gitlab-app-id: {{ .Values.stategraph.orchestration.gitlab.appId | quote }}
  gitlab-app-secret: {{ .Values.stategraph.orchestration.gitlab.appSecret | quote }}
  gitlab-access-token: {{ .Values.stategraph.orchestration.gitlab.accessToken | quote }}
  {{- end }}
{{- end }}
