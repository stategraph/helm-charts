{{/*
This Secret carries two independent things: the generated database password and the OAuth
credentials. They are gated separately -- pointing postgresql.auth.existingSecret at an externally
managed Secret must not suppress the OAuth keys, which deployment.yaml always reads from THIS
Secret by name. Gating the whole file on the database left those pods in
CreateContainerConfigError.
*/}}
{{- $manageDbPassword := not .Values.postgresql.auth.existingSecret }}
{{- if or $manageDbPassword .Values.stategraph.oauth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stategraph.fullname" . }}
  labels:
    {{- include "stategraph.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $manageDbPassword }}
  {{- if .Values.postgresql.auth.password }}
  db-password: {{ .Values.postgresql.auth.password | quote }}
  {{- else }}
  # No explicit password was provided, so we generate one. On upgrades we must
  # reuse the password already stored in the existing Secret — Postgres baked the
  # original password into its data directory at first init, so regenerating it
  # here would break authentication for the already-provisioned database.
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "stategraph.fullname" .) }}
  {{- if and $existing $existing.data (index $existing.data "db-password") }}
  db-password: {{ index $existing.data "db-password" | b64dec | quote }}
  {{- else }}
  db-password: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if .Values.stategraph.oauth.enabled }}
  oauth-client-id: {{ .Values.stategraph.oauth.clientId | quote }}
  oauth-client-secret: {{ .Values.stategraph.oauth.clientSecret | quote }}
  # oauth2-proxy cookie-signing secret. It must be identical across every
  # replica and stable across restarts — the app generates a random one per
  # process when this is unset, so with replicaCount > 1 (or after any restart)
  # a login whose callback lands on a different pod fails with
  # "invalid CSRF token". Honor an explicit value; otherwise reuse the one
  # already stored (so `helm upgrade` doesn't rotate it and log everyone out);
  # otherwise generate a stable 32-char value on first install.
  {{- if .Values.stategraph.oauth.cookieSecret }}
  oauth-cookie-secret: {{ .Values.stategraph.oauth.cookieSecret | quote }}
  {{- else }}
  {{- $existingCookie := lookup "v1" "Secret" .Release.Namespace (include "stategraph.fullname" .) }}
  {{- if and $existingCookie $existingCookie.data (index $existingCookie.data "oauth-cookie-secret") }}
  oauth-cookie-secret: {{ index $existingCookie.data "oauth-cookie-secret" | b64dec | quote }}
  {{- else }}
  oauth-cookie-secret: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- end }}
  {{- if and (eq .Values.stategraph.oauth.type "google") .Values.stategraph.oauth.google.serviceAccountJson }}
  oauth-service-account-json: {{ .Values.stategraph.oauth.google.serviceAccountJson | quote }}
  {{- end }}
  {{- end }}
{{- end }}
