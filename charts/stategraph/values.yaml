# Default values for the stategraph Helm chart.

stategraph:
  image:
    repository: ghcr.io/stategraph/stategraph-server
    # Empty means the chart's appVersion. Pin a version from
    # https://github.com/stategraph/releases/releases for production.
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 4Gi

  # Public URL that users open (STATEGRAPH_UI_BASE). An https:// URL sets the
  # Secure flag on cookies; an http:// URL does not, so a plain-HTTP host
  # name works for a port-forward or an internal network.
  ui:
    base: "http://localhost:8080"
    # Base of the /oauth2/{provider}/callback URLs. Empty means ui.base.
    oauthRedirectBase: ""

  # Internal application server port. nginx inside the image proxies to it.
  port: "8180"

  # Enterprise license key (STATEGRAPH_LICENSE_KEY). The key completes the
  # first-time setup; without it the setup screen asks for one.
  license:
    key: ""
    # Read the key from a Secret you manage yourself instead.
    existingSecret: ""
    existingSecretKey: "license-key"

  # Cost estimation. The in-image pricing service loads the price book into
  # the cloud_pricing database on first start and refreshes it weekly. The
  # pricing database is on the same PostgreSQL server, with the same user and
  # password, as the stategraph database; the loader creates it, so the user
  # needs CREATEDB, or the database must exist.
  cost:
    enabled: false
    databaseName: cloud_pricing
    # libpq sslmode for the pricing database connection.
    sslMode: disable
    # Price-book refresh interval in hours. Empty means the image default
    # (168). 0 turns the refresh off.
    refreshHours: ""

  # Security scanning of states with checkov (STATEGRAPH_SECURITY).
  security:
    enabled: false

  # Stategraph Orchestration: plans and applies from pull requests. Needs the
  # terrateam database and the two FDW roles on the PostgreSQL server; see
  # provisionDatabase below.
  orchestration:
    enabled: false
    # Public URLs. Empty means derived from ui.base: apiBase is ui.base plus
    # /api, uiBase and webBaseUrl are ui.base.
    apiBase: ""
    uiBase: ""
    webBaseUrl: ""
    # TERRAT_TELEMETRY_LEVEL: anonymous or disabled. Empty means the image
    # default (anonymous).
    telemetryLevel: ""
    # Name of the Orchestration database.
    databaseName: terrateam
    # Create the Orchestration database and the two FDW roles on the
    # PostgreSQL server from an init container on the server pod, with the
    # stategraph database credentials and psql from postgresql.image. The
    # connecting role needs CREATEDB and CREATEROLE (the bundled PostgreSQL
    # user has both). Set to false on a managed server where you create them
    # by hand.
    provisionDatabase: true
    provisionDatabaseResources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    # The two roles through which the stategraph database reads the
    # Orchestration database over postgres_fdw.
    fdw:
      user: stategraph_mql
      provisionerUser: stategraph_provisioner
      # Passwords. Leave blank to generate stable values on first install
      # (preserved across helm upgrade). With provisionDatabase false, set
      # them to the passwords you gave the roles.
      password: ""
      provisionerPassword: ""
      # Read both passwords from a Secret you manage yourself instead.
      existingSecret: ""
      existingSecretKeys:
        password: "fdw-password"
        # Empty means the provisioner password is not wired up, and
        # connecting a GitLab group from the console is off.
        provisionerPassword: "fdw-provisioner-password"
    # GitHub App. Orchestration runs as this App. Set appId (and the other
    # inline values) or existingSecret to turn GitHub on.
    github:
      appId: ""
      clientId: ""
      clientSecret: ""
      pem: ""
      webhookSecret: ""
      # Install URL of the App, linked from the console. Leave empty rather
      # than setting an empty string in extraEnv.
      appUrl: ""
      # GitHub Enterprise Server.
      apiBaseUrl: ""
      webBaseUrl: ""
      # Read the five credentials from a Secret you manage yourself instead
      # of the inline values above.
      existingSecret: ""
      existingSecretKeys:
        appId: "github-app-id"
        clientId: "github-app-client-id"
        clientSecret: "github-app-client-secret"
        pem: "github-app-pem"
        webhookSecret: "github-webhook-secret"
    # GitLab. Set appId (and the other inline values) or existingSecret to
    # turn GitLab on.
    gitlab:
      appId: ""
      appSecret: ""
      accessToken: ""
      # Self-managed GitLab: root URL of the instance, without /api/v4.
      apiBaseUrl: ""
      webBaseUrl: ""
      existingSecret: ""
      existingSecretKeys:
        appId: "gitlab-app-id"
        appSecret: "gitlab-app-secret"
        accessToken: "gitlab-access-token"

  # Extra environment variables for the Stategraph server, as a list of
  # Kubernetes EnvVar objects passed through verbatim. Escape hatch for settings
  # the chart does not expose first-class. Entries set here win over the chart's
  # own settings. Because these are real EnvVar objects, a value can come from a
  # Secret you manage yourself (External Secrets Operator, sealed-secrets, ...)
  # instead of being written into this file:
  #
  #   extraEnv:
  #     - name: STATEGRAPH_ACCESS_LOG
  #       value: "/dev/stdout"
  #     - name: STATEGRAPH_SOME_TOKEN
  #       valueFrom:
  #         secretKeyRef:
  #           name: stategraph-external
  #           key: some-token
  #
  # The older map form (STATEGRAPH_ACCESS_LOG: "/dev/stdout") is still accepted.
  extraEnv: []

  # Extra volumes and mounts for the Stategraph server, in plain Kubernetes
  # syntax. Escape hatch for anything that has to reach the container as a FILE
  # rather than an env var -- a CA bundle, a TLS keypair, a credentials file:
  #
  #   extraVolumes:
  #     - name: google-sa
  #       secret:
  #         secretName: my-google-sa
  #   extraVolumeMounts:
  #     - name: google-sa
  #       mountPath: /var/secrets/google
  #       readOnly: true
  #
  # Then point the consuming setting at the mounted path via extraEnv.
  extraVolumes: []
  extraVolumeMounts: []

  # Additional labels for the Stategraph server pods, merged into
  # spec.template.metadata.labels on the Deployment. Use this when a policy
  # check requires specific labels on pods. Additive only -- the Deployment's
  # selector is not affected.
  #
  #   podLabels:
  #     team: platform
  #     cost-center: "1234"
  podLabels: {}

  # At stop the server refuses new requests, finishes those in progress, then
  # exits, within 55 seconds. A shorter grace period cuts requests short.
  terminationGracePeriodSeconds: 60

  # /health/live answers as soon as nginx is up. /health/ready answers 200 only
  # after the database migrations ran and the server serves requests. On a
  # fresh or large database the migrations can take minutes; the startup probe
  # allows failureThreshold * periodSeconds for them before liveness begins.
  startupProbe:
    httpGet:
      path: /health/ready
      port: http
    periodSeconds: 5
    failureThreshold: 60
  livenessProbe:
    httpGet:
      path: /health/live
      port: http
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health/ready
      port: http
    periodSeconds: 5
    failureThreshold: 3

  # Database tuning
  db:
    # Postgres statement_timeout for application queries (Postgres interval syntax)
    statementTimeout: "60s"

  # OAuth configuration (optional). Local email and password sign-in is on
  # when this is off.
  oauth:
    enabled: false
    type: ""  # "google" or "oidc"
    clientId: ""
    clientSecret: ""
    # Read the OAuth credentials from a Secret you manage yourself, instead of
    # having the chart create one from the values below. Set this and leave
    # clientId/clientSecret/cookieSecret/google.serviceAccountJson empty when
    # the Secret is produced by the External Secrets Operator, sealed-secrets,
    # or anything else that keeps the plaintext out of your values file.
    existingSecret: ""
    # Key names inside that Secret. Only consulted when existingSecret is set.
    # clientId/clientSecret fall back to the names below when left empty;
    # cookieSecret and googleServiceAccountJson are only wired up when named,
    # since referencing a key the Secret does not carry leaves the pod in
    # CreateContainerConfigError.
    existingSecretKeys:
      clientId: "oauth-client-id"
      clientSecret: "oauth-client-secret"
      # Required for correct login when replicaCount > 1 -- see cookieSecret
      # below. Must be 16, 24, or 32 bytes.
      cookieSecret: ""
      # Only for oauth.type=google with Google group membership checks.
      googleServiceAccountJson: ""
    # oauth2-proxy cookie-signing secret. Must be 16, 24, or 32 characters.
    # Leave blank to auto-generate a stable value on first install (preserved
    # across `helm upgrade`). Set explicitly only if you need to share the same
    # secret across clusters. Required for correct login when replicaCount > 1.
    cookieSecret: ""
    displayName: "OAuth Login"
    emailDomain: "*"
    # Google-specific settings
    google:
      group: ""
      adminEmail: ""
      serviceAccountJson: ""
    # OIDC-specific settings
    oidc:
      issuerUrl: ""

# PostgreSQL database configuration
postgresql:
  # Enable bundled PostgreSQL (disable to use external database)
  enabled: true

  # PostgreSQL image. Also provides psql for the Orchestration init container.
  image:
    repository: postgres
    tag: 17-alpine
    pullPolicy: IfNotPresent

  # Database credentials
  auth:
    username: stategraph
    password: ""  # Leave empty to auto-generate. For production, use existingSecret instead!
    database: stategraph
    # Use existing secret for password (recommended for production)
    existingSecret: ""  # Name of existing secret containing 'db-password' key
    existingSecretKey: "db-password"  # Key in the secret containing the password

  # PostgreSQL connection details (used when postgresql.enabled=false)
  host: postgres
  port: 5432

  # Resource limits and requests
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "8"
      memory: 8Gi

  # Persistence configuration
  persistence:
    enabled: true
    size: 10Gi
    # storageClass: ""  # Uncomment and set for production

# Kubernetes service configuration
service:
  type: ClusterIP
  port: 80
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: stategraph.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: stategraph-tls
    #   hosts:
    #     - stategraph.example.com

# Security context
securityContext: {}
  # runAsNonRoot: true
  # runAsUser: 1000
  # fsGroup: 1000

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}
